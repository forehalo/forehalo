# Cloudflare Worker — static SPA for the forehalo portfolio.
# Git push → Workers Builds: build command `pnpm build` / `vp build`,
# deploy command defaults to `npx wrangler deploy` (uses local wrangler).
name = "forehalo"
compatibility_date = "2026-07-23"
workers_dev = true

# Serve Vite's production output. Missing paths (e.g. /napi on refresh)
# fall back to index.html so React Router owns the URL.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
