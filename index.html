    <!-- FOUC: apply .dark/.light before first paint. Keep key + resolve rules
         in sync with src/lib/theme.ts (THEME_STORAGE_KEY / resolveTheme). -->
    <script>
      (function () {
        try {
          var key = "fh-theme";
          var pref = localStorage.getItem(key);
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = pref === "light" || pref === "dark" ? pref : systemDark ? "dark" : "light";
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
