    <!-- FOUC: apply .dark/.light before first paint. Keep key + resolve rules
         in sync with src/lib/theme.ts (THEME_STORAGE_KEY / resolveTheme). -->
    <script>
      (function () {
        try {
          var key = "fh-theme";
          var pref = localStorage.getItem(key);
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = pref === "light" || pref === "dark" ? pref : systemDark ? "dark" : "light";
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <!-- Self-hosted Space Grotesk + JetBrains Mono (public/fonts/) -->
