allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
catalog:
  oxlint-tsgolint: 7.0.2001
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vite-plus: 0.2.5
# Versions below were published <24h before 2026-07-20 and trip pnpm 11's
# minimumReleaseAge gate; exclusions can be removed after 2026-07-21.
minimumReleaseAgeExclude:
  - typescript
  - oxlint-tsgolint
overrides:
  oxlint-tsgolint: "catalog:"
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
